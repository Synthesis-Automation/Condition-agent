[pytest]
# Pytest configuration for Condition-agent project

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts = 
    -v
    --tb=short
    --strict-markers

# Warning filters - suppress external library deprecation warnings
filterwarnings =
    # Ignore all deprecation warnings from external libraries (not our code)
    ignore::DeprecationWarning:rxnmapper
    ignore::DeprecationWarning:pkg_resources
    ignore::DeprecationWarning:rxn_insight
    ignore::DeprecationWarning:_distutils_hack
    # Show deprecation warnings from our code (chemtools)
    default::DeprecationWarning:chemtools
    default::DeprecationWarning:app
    default::DeprecationWarning:tests

# Test paths
testpaths = tests

# Markers for organizing tests
markers =
    unit: Unit tests for individual modules
    integration: Integration tests across modules
    slow: Tests that take more than 1 second
    edge_case: Edge case and boundary tests
