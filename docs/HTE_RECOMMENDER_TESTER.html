<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HTE Recommender API Tester</title>
  <style>
    :root {
      --bg: #0f1b24;
      --panel: #162634;
      --text: #e6eef6;
      --muted: #9bb0c3;
      --accent: #3aa2ff;
      --border: #274257;
      --error: #ff6b6b;
      --success: #3ecf8e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      background: radial-gradient(circle at 10% 10%, #1b2c3c 0%, #0f1b24 55%);
      color: var(--text);
    }
    header {
      padding: 24px 28px 8px;
      border-bottom: 1px solid var(--border);
    }
    header h1 {
      margin: 0 0 6px;
      font-size: 22px;
      font-weight: 600;
    }
    header p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
    }
    main {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
      padding: 18px 28px 28px;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      min-height: 380px;
    }
    label {
      display: block;
      font-size: 13px;
      margin-bottom: 6px;
      color: var(--muted);
    }
    input, textarea, select, button {
      width: 100%;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #0f1e2a;
      color: var(--text);
      padding: 10px 12px;
      font-size: 14px;
    }
    textarea {
      min-height: 190px;
      font-family: "Consolas", "Courier New", monospace;
    }
    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 12px;
    }
    .actions {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }
    button {
      cursor: pointer;
      background: var(--accent);
      border: none;
      font-weight: 600;
    }
    button.secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
    }
    pre {
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 13px;
      line-height: 1.45;
      margin: 0;
      color: var(--text);
    }
    .status {
      margin-top: 10px;
      font-size: 13px;
      color: var(--muted);
    }
    .status.error { color: var(--error); }
    .status.success { color: var(--success); }
    @media (max-width: 980px) {
      main { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <h1>HTE Recommender API Tester</h1>
    <p>Send a request to <code>http://127.0.0.1:8000/hte/recommendations</code> and inspect the response.</p>
  </header>
  <main>
    <section class="panel">
      <label for="endpoint">Endpoint</label>
      <input id="endpoint" value="http://127.0.0.1:8000/hte/recommendations" />

      <div class="row">
        <div>
          <label for="reaction">Reaction SMILES</label>
          <input id="reaction" value="Brc1ccccc1.Nc1ccccc1>>c1ccc(Nc2ccccc2)cc1" />
        </div>
        <div>
          <label for="reactionFilter">Reaction Type Filter</label>
          <input id="reactionFilter" value="C_N_Coupling" />
        </div>
      </div>

      <div class="row">
        <div>
          <label for="catalystFilter">Catalyst Filter</label>
          <input id="catalystFilter" value="Pd" />
        </div>
        <div>
          <label for="topK">Top K</label>
          <input id="topK" type="number" min="1" max="200" value="10" />
        </div>
      </div>

      <label for="payload">Payload</label>
      <textarea id="payload"></textarea>

      <div class="actions">
        <button id="sendBtn">Send Request</button>
        <button class="secondary" id="resetBtn">Reset Payload</button>
      </div>
      <div id="status" class="status"></div>
    </section>

    <section class="panel">
      <label>Response</label>
      <pre id="response">{}</pre>
    </section>
  </main>

  <script>
    const endpointEl = document.getElementById("endpoint");
    const reactionEl = document.getElementById("reaction");
    const reactionFilterEl = document.getElementById("reactionFilter");
    const catalystFilterEl = document.getElementById("catalystFilter");
    const topKEl = document.getElementById("topK");
    const payloadEl = document.getElementById("payload");
    const statusEl = document.getElementById("status");
    const responseEl = document.getElementById("response");

    function buildPayload() {
      return {
        input: {
          reaction_smiles: reactionEl.value.trim(),
          reaction_type_filter: reactionFilterEl.value.trim() || null,
          catalyst_filter: catalystFilterEl.value.trim() || null,
          top_k: Number(topKEl.value || 10),
          min_experiments: 2
        }
      };
    }

    function resetPayload() {
      const payload = buildPayload();
      payloadEl.value = JSON.stringify(payload, null, 2);
    }

    function setStatus(message, type) {
      statusEl.textContent = message;
      statusEl.className = "status" + (type ? " " + type : "");
    }

    document.getElementById("sendBtn").addEventListener("click", async () => {
      setStatus("Sending request ...");
      responseEl.textContent = "{}";
      let payload;
      try {
        payload = JSON.parse(payloadEl.value);
      } catch (err) {
        setStatus("Invalid JSON payload.", "error");
        return;
      }
      try {
        const res = await fetch(endpointEl.value.trim(), {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        const text = await res.text();
        let data;
        try {
          data = JSON.parse(text);
        } catch (_) {
          data = text;
        }
        responseEl.textContent = typeof data === "string" ? data : JSON.stringify(data, null, 2);
        setStatus(res.ok ? "Success" : `Request failed: ${res.status}`, res.ok ? "success" : "error");
      } catch (err) {
        setStatus(`Error: ${err.message}`, "error");
      }
    });

    document.getElementById("resetBtn").addEventListener("click", resetPayload);
    resetPayload();
  </script>
</body>
</html>
